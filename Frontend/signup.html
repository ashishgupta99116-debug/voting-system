
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoteSphere | Sign Up</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">
        <div class="login-card signup-card">

            <div class="logo">VoteSphere</div>
            <p class="tagline">Your voice. Your vote. Your choice.</p>

            <h2>Create Account</h2>
            <p class="subtitle">Register to participate in the election</p>

            <form id="signupForm">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name"
                        placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age"
                        placeholder="Enter your age" min="1" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address (optional)</label>
                    <input type="email" id="email"
                        placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label for="mobilenumber">Mobile Number</label>
                    <input type="tel" id="mobilenumber"
                        placeholder="Enter your mobile number"
                        maxlength="15" required>
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <textarea id="address"
                        placeholder="Enter your address"
                        rows="3" required></textarea>
                </div>

                <div class="form-group">
                    <label for="aadhaarcardnumber">Aadhaar Card Number</label>
                    <input type="text" id="aadhaarcardnumber"
                        placeholder="Enter your 12-digit Aadhaar number"
                        inputmode="numeric" maxlength="12" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password"
                        placeholder="Create a password" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword"
                        placeholder="Re-enter your password" required>
                </div>

                <button type="submit" id="signupBtn">
                    Create Account
                </button>

                <p id="signupMessage"></p>

            </form>

            <p class="signup-text">
                Already have an account?
                <a href="index.html">Login</a>
            </p>

        </div>
    </div>

    <script src="js/signup.js"></script>

</body>
</html>
