
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoteSphere | Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">
        <div class="login-card">

            <div class="logo">VoteSphere</div>
            <p class="tagline">Your voice. Your vote. Your choice.</p>

            <h2>Welcome Back!</h2>
            <p class="subtitle">Login to continue to your account</p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="aadhaarcardnumber">
                        Aadhaar Card Number
                    </label>

                    <input
                        type="text"
                        id="aadhaarcardnumber"
                        placeholder="Enter your Aadhaar number"
                        inputmode="numeric"
                        maxlength="12"
                        pattern="[0-9]{12}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" id="loginBtn">
                    Login
                </button>

                <p id="message"></p>

            </form>

            <p class="signup-text">
                Don't have an account?
                <a href="signup.html">Sign up</a>
            </p>

        </div>
    </div>

    <script src="js/auth.js"></script>

</body>
</html>
